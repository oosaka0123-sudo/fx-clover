name: P0 evidence queue refresh

on:
  push:
    branches:
      - research/issue-18-p0-master-course-review
    paths:
      - .github/workflows/p0-review-queue-refresh.yml
      - build_poconical_review_queue.py
      - knowledge/p0_master_course_blog_review.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test queue builder
        run: python -m unittest -v test_build_poconical_review_queue.py
      - name: Rebuild review queue
        run: python build_poconical_review_queue.py
      - name: Validate review queue
        run: python validate_poconical_review_queue.py
      - name: Show summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('knowledge/poconical_review_queue.json').read_text(encoding='utf-8'))
          print('status_counts=', q['status_counts'])
          print('priority_counts=', q['priority_counts'])
          for item in q['items'][:12]:
              print(item['review_order'], item['priority'], item['post_id'], item['title'])
          PY
      - name: Commit refreshed queue
        run: |
          if git diff --quiet -- knowledge/poconical_review_queue.json; then
            echo "No queue change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/poconical_review_queue.json
          git commit -m "Advance review queue after P0 master-course review"
          git push origin HEAD:${GITHUB_REF_NAME}
