name: v1.23 integrity

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify release-critical SHA-256 files
        run: |
          python - <<'PY'
          from verify_distribution_v1_23 import verify
          result = verify(import_modules=False)
          for row in result["critical_files"]:
              print(row["file"], row["hash_matches"], row["sha256"])
          if result["status"] != "PASS":
              raise SystemExit(1)
          PY
      - name: Safety scan MQL4 order functions
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("FX_Clover_MTF_Exporter_v1_23.mq4").read_text(encoding="utf-8")
          forbidden = ["OrderSend", "OrderClose", "OrderModify", "OrderDelete", "WebRequest"]
          found = [token for token in forbidden if token in text]
          print("forbidden_tokens_found=", found)
          if found:
              raise SystemExit(1)
          PY
      - name: Test metadata-only FX-Clover catalog parser
        run: python -m unittest -v test_sync_fxclover_catalog.py
      - name: Validate committed Poconical metadata catalog
        run: python validate_poconical_catalog.py
      - name: Test Poconical review queue triage rules
        run: python -m unittest -v test_build_poconical_review_queue.py
      - name: Validate committed Poconical review queue
        run: python validate_poconical_review_queue.py
      - name: Verify review queue is regenerated from current inputs
        run: |
          python build_poconical_review_queue.py --output /tmp/poconical_review_queue.json
          cmp knowledge/poconical_review_queue.json /tmp/poconical_review_queue.json
      - name: Validate READY manual-field evidence registry
        run: python validate_ready_field_registry.py
